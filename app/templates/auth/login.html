{% extends "base.html" %}
{% block title %}Log in — Maia{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post" class="card" style="max-width:26rem;">
    {{ form.hidden_tag() }}
    <div class="field">
      {{ form.email.label }}
      {{ form.email(placeholder="you@university.edu") }}
    </div>
    <div class="field">
      {{ form.password.label }}
      {{ form.password() }}
    </div>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
{% endblock %}
