# Curated resource index — source of truth, compiled into a read-only SQLite
# file at build time by tools/build_resource_index.py (never fetched at
# runtime; see docs/IMPLEMENTATION_PLAN.md §7).
#
# `checked` is deliberately left unset on every entry in this seed: these
# URLs were chosen for being well-known, long-stable, official documentation
# pages, but none of them has actually been probed by tools/check_links.py
# yet. Run that (it needs network access) before trusting this list in front
# of a real cohort — see docs §7.2's "link checking is a CI gate" and Phase C
# ("resource curation") in the build order, which is the human follow-up this
# seed is meant to unblock, not replace.
#
# This is the "thin ~40-resource seed" the plan calls for at Phase 2b, not
# the ~250-resource target — coverage favours getting at least one resource
# on every essential concept over depth on any single one.
