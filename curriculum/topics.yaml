        aliases: [argon2, bcrypt, salt, hashing, rainbow table]
        related: [session-auth]
      - id: oauth-oidc
        name: "OAuth2 / OpenID Connect delegated login"
        essential: false
        aliases: [oauth, oidc, sso, authorization code flow, identity provider]
        related: [session-auth]
      - id: csrf-protection
        name: "CSRF protection for state-changing requests"
        essential: true
        aliases: [csrf, samesite cookie, double submit, csrf token]
        related: [session-auth, resource-modeling]
      - id: mfa
        name: "Multi-factor authentication"
        essential: false
        aliases: [mfa, 2fa, totp, webauthn, passkeys]
        related: [password-hashing]
      - id: credential-rotation
        name: "Secret and credential rotation"
        essential: false
        aliases: [key rotation, secret rotation, revocation, token expiry]
        related: [secrets-management]

