# Curriculum — source of truth, seeded into the DB at boot by `flask seed-curriculum`.
#
# Concept `id`s are permanent public identifiers: tutorials, resource-index
# entries, and mastery rows all reference them. Renaming one requires a
# migration (see docs/IMPLEMENTATION_PLAN.md §4.1).
#
# This is a seed covering all ten planned topic areas at moderate depth
# (~5-6 concepts each) rather than the full ~90-concept target — breadth
# across topics first, depth within each topic as a follow-up (see the plan's
# Phase C, "Resource curation", for the equivalent expansion on the resource
# side).
version: 1
topics:
  - id: research-demonstrator-stack
    title: "Standing up a ChatGPT-like research demonstrator"
    band: 2
    concepts:
      - id: containerization
        name: "Containerisation (Docker)"
        essential: true
        aliases: [docker, container, oci, image, dockerfile, podman]
        probe: "Ships a reproducible environment as an image rather than 'works on my machine'"
        related: [ci-cd, dependency-pinning, orchestration]
      - id: inference-server
        name: "Dedicated inference server (vLLM / TGI)"
        essential: true
        aliases: [vllm, tgi, kv cache, continuous batching, llama.cpp, text-generation-inference]
        probe: "Serves the model from one warm, batching-aware process instead of loading it per request"
        related: [gpu-scheduling, request-batching, streaming-responses]
      - id: request-batching
        name: "Request batching for LLM inference"
        essential: true
        aliases: [continuous batching, dynamic batching, throughput, queueing]
        probe: "Groups concurrent generation requests so GPU throughput doesn't collapse to one-at-a-time"
        related: [inference-server, gpu-scheduling]
      - id: orchestration
        name: "Orchestration & horizontal scaling (Kubernetes / Slurm)"
        essential: false
        aliases: [kubernetes, k8s, slurm, autoscaling, helm, pods]
        related: [load-balancing, containerization, gpu-scheduling]
      - id: load-balancing
        name: "Load balancing a web + inference stack"
        essential: true
        aliases: [nginx, reverse proxy, sticky sessions, health checks, round robin]
        probe: "Spreads requests across replicas so one slow or overloaded instance doesn't stall everyone"
        related: [orchestration, streaming-responses]
      - id: streaming-responses
        name: "Streaming model output to the browser (SSE / websockets)"
        essential: false
        aliases: [server-sent events, sse, websocket, token streaming, chunked response]
        related: [resource-modeling, load-balancing]

